# Environment Configuration - 緊急修正版
environment:
  name: "BittleWalkingEnv"
  
  # Corridor environment - 前進歩行用に拡張
  corridor:
    width: 0.5       # m (50cm) - より広い通路で安定性向上
    length: 10.0     # m - 長距離前進を可能にする  
    wall_height: 0.05 # m
  
  # Observation space (30 dimensions total)
  observation:
    joint_angles: 8      # Current joint angles
    joint_velocities: 8  # Joint angular velocities
    imu_data: 6         # 3D acceleration + 3D angular velocity
    position_orientation: 6  # 3D position + 3D orientation
    target_position: 2   # Target X, Y coordinates
    total_dimensions: 30
  
  # Action space (8 dimensions)
  action:
    joint_targets: 8     # Target joint angles
    action_range: [-1.0, 1.0]  # Normalized action range
    control_frequency: 50  # Hz
  
  # Reward function weights - 超シンプル前進歩行用
  reward:
    # 基本報酬（シンプル）
    forward_reward: 10.0            # 前進距離に比例（大幅に削減）
    speed_reward: 5.0               # 前進速度に比例（大幅に削減）
    
    # 安定性報酬（軽微）
    stability_reward: 2.0           # 姿勢安定性（大幅に削減）
    
    # 最小限のペナルティ
    fall_penalty: -1.0              # 転倒時の軽いペナルティ（大幅に軽減）
    corridor_penalty: -0.5          # 通路外の軽いペナルティ（大幅に軽減）
    
    # 互換性維持用（最小値）
    goal_distance_reward: 0.1       # 目標距離報酬（最小）
    goal_progress_reward: 0.1       # 目標進捗報酬（最小）
    direction_reward: 0.1           # 方向報酬（最小）
    corridor_reward: 0.1            # 通路内報酬（最小）
    joint_limit_penalty: -0.1       # 関節制限ペナルティ（最小）
    torque_change_penalty: -0.001   # トルク変化ペナルティ（最小）
    success_bonus: 1.0             # 成功ボーナス（最小）
    time_bonus: 0.1                 # 時間ボーナス（最小）
    energy_penalty: -0.001         # エネルギー効率（最小）
    
    # ゴール距離報酬のパラメータ（互換性維持）
    goal_distance_params:
      max_distance: 10.0            # 最大距離（10m通路用）
      min_distance: 0.1             # 最小距離（10cm）
      distance_decay: 0.5           # 距離減衰係数

# Simulation settings
simulation:
  physics_engine: "pybullet"
  timestep: 0.00416666667  # 1/240 Hz (240 Hz)
  gravity: [0, 0, -9.81]
  
  # Contact and collision
  contact_erp: 0.2
  contact_cfm: 0.0001
  lateral_friction: 0.8  # Default friction
  spinning_friction: 0.1
  rolling_friction: 0.1
  restitution: 0.1
  
  # Solver settings
  num_solver_iterations: 100
  num_substeps: 1

# Environment variations
variations:
  # Surface types
  surfaces:
    cardboard:
      friction: 0.8
      restitution: 0.1
      name: "cardboard"
    
    smooth_desk:
      friction: 0.1
      restitution: 0.05
      name: "smooth_desk"
  
  # Domain randomization
  randomization:
    friction_std: 0.1
    mass_std: 0.02  # 2% of body mass
    sensor_noise_std: 0.01
    action_noise_std: 0.01

# Training settings (for environment)
training:
  episode:
    max_steps: 1000  # ~4 seconds at 240Hz
    max_time: 4.0    # seconds

# Visualization and debugging
visualization:
  gui: false
  debug_lines: false
  show_joint_frames: false
  show_center_of_mass: false
  
  # Camera settings
  camera:
    distance: 2.0
    yaw: 0.0
    pitch: -30.0
    target_position: [0, 0, 0.1]
