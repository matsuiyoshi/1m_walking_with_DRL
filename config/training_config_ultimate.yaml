# Training Configuration for PPO - 究極最適化版
algorithm:
  name: "PPO"
  
  # 最適化されたネットワーク構造
  network:
    use_optimized: true           # 最適化ネットワーク使用
    
    actor:
      hidden_layers: [256, 128, 64]    # 軽量化ネットワーク
      activation: "Swish"               # 最適活性化関数
      output_activation: "Tanh"
      dropout_rate: 0.1                 # 適度な正則化
      use_residual: true                # 残差接続
      use_attention: false              # 軽量化
      use_layer_norm: true              # 正規化
    
    critic:
      hidden_layers: [256, 128, 64]    # 軽量化ネットワーク
      activation: "Swish"               # 最適活性化関数
      dropout_rate: 0.1                 # 適度な正則化
      use_residual: true                # 残差接続
      use_layer_norm: true              # 正規化
  
  # 最適化されたハイパーパラメータ
  hyperparameters:
    learning_rate: 0.0004           # 最適学習率
    batch_size: 128                 # 軽量化バッチサイズ
    n_epochs: 3                     # 過学習防止
    clip_range: 0.15                # クリッピング範囲調整
    vf_coef: 0.4                    # 価値関数係数調整
    ent_coef: 0.015                 # エントロピー係数調整
    max_grad_norm: 0.3              # 勾配クリッピング強化
    gae_lambda: 0.93                # GAE調整
    gamma: 0.995                    # 割引率調整
    buffer_size: 1024               # バッファサイズ軽量化
    
    # オプティマイザー設定（最適化）
    optimizer:
      type: "AdamW"
      weight_decay: 0.005           # 重み減衰調整
      betas: [0.9, 0.999]
      eps: 1e-8
    
    # 学習率スケジューリング（最適化）
    lr_schedule:
      type: "cosine_annealing"
      T_max: 50000                  # 半周期
      eta_min: 0.00005              # 最小学習率

# 最適化された学習設定
training:
  total_timesteps: 50000          # 短期集中学習
  eval_freq: 5000                 # 頻繁な評価
  save_freq: 5000                 # 頻繁な保存
  log_interval: 10                # 詳細ログ
  
  # Episode settings（最適化）
  episode:
    max_steps: 200                # 短いエピソード（効率化）
    max_time: 8.0                 # 短い時間制限
  
  # Environment settings（最適化）
  env:
    num_envs: 6                   # 環境数調整（バランス）
    render: false
    render_mode: "human"
  
  # Domain randomization（最小限）
  domain_randomization:
    enabled: true
    friction_range: [0.65, 0.75]   # 狭い範囲
    mass_variation: 0.01          # 最小変動
    noise_std: 0.0                # ノイズなし

# 最適化されたEarly Stopping
early_stopping:
  enabled: true
  patience: 2000                  # 短いpatience
  min_delta: 0.01                 # 小さな改善閾値
  monitor_metric: "avg_reward"
  restore_best_weights: true
  
  # 過学習検出（厳密）
  overfitting_detection:
    enabled: true
    policy_loss_threshold: 20.0   # 低い閾値
    value_loss_threshold: 0.8     # 低い閾値
    reward_std_threshold: 0.2     # 低い閾値

# 評価設定（軽量化）
evaluation:
  num_episodes: 3
  deterministic: true
  render: false
  
  # 成功基準（現実的）
  success_criteria:
    min_distance: 0.4             # 40cm以上で成功
    max_time: 8.0
    max_fall_angle: 0.8           # より厳密

# ログ設定（軽量化）
logging:
  tensorboard: true
  wandb: false
  log_dir: "data/logs"
  
  # 重要指標のみ
  metrics:
    - "episode_reward"
    - "episode_length"
    - "success_rate"
    - "policy_loss"
    - "value_loss"
