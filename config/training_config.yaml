# Training Configuration for PPO
algorithm:
  name: "PPO"
  
  # Network architecture
  network:
    actor:
      hidden_layers: [256, 256, 128]
      activation: "ReLU"
      output_activation: "Tanh"
    
    critic:
      hidden_layers: [256, 256, 128]
      activation: "ReLU"
  
  # Hyperparameters (GPU並列処理最適化)
  hyperparameters:
    learning_rate: 0.001  # より高い学習率で効率的に学習
    batch_size: 256  # GPU並列処理用にバッチサイズを増加
    n_epochs: 10
    clip_range: 0.2
    vf_coef: 0.5
    ent_coef: 0.01
    max_grad_norm: 0.5
    gae_lambda: 0.95
    gamma: 0.99
    buffer_size: 2048

# Training settings (1時間学習用)
training:
  total_timesteps: 300000  # 1時間で実行可能なタイムステップ数
  eval_freq: 30000        # より頻繁に評価
  save_freq: 60000        # より頻繁に保存
  log_interval: 3000      # より頻繁にログ出力
  
  # Episode settings
  episode:
    max_steps: 6000  # ~25 seconds at 240Hz
    max_time: 25.0   # seconds
  
  # Environment settings
  env:
    num_envs: 8  # 並列環境数を増加（GPU並列処理用）
    render: false
    render_mode: "human"
  
  # Randomization for domain adaptation
  domain_randomization:
    enabled: true
    friction_range: [0.1, 0.8]
    mass_variation: 0.1  # ±10%
    noise_std: 0.01

# Evaluation settings
evaluation:
  num_episodes: 10
  deterministic: true
  render: true
  
  # Success criteria
  success_criteria:
    min_distance: 0.9  # m (90% of 1m)
    max_time: 10.0     # seconds
    max_fall_angle: 0.5  # radians

# Logging and monitoring
logging:
  tensorboard: true
  wandb: false  # Set to true if using Weights & Biases
  log_dir: "data/logs"
  
  # Metrics to track
  metrics:
    - "episode_reward"
    - "episode_length"
    - "success_rate"
    - "average_speed"
    - "fall_rate"
    - "energy_efficiency"
