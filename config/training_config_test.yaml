# Training Configuration for PPO - テスト用（5分学習）
algorithm:
  name: "PPO"
  
  # Network architecture
  network:
    actor:
      hidden_layers: [256, 256, 128]
      activation: "ReLU"
      output_activation: "Tanh"
    
    critic:
      hidden_layers: [256, 256, 128]
      activation: "ReLU"
  
  # Hyperparameters (テスト用)
  hyperparameters:
    learning_rate: 0.0003
    batch_size: 128  # 小さなバッチサイズ
    n_epochs: 5      # 少ないエポック数
    clip_range: 0.2
    vf_coef: 0.5
    ent_coef: 0.01
    max_grad_norm: 0.5
    gae_lambda: 0.95
    gamma: 0.99
    buffer_size: 1024  # 小さなバッファ

# Training settings (テスト用 - 5分学習)
training:
  total_timesteps: 10000   # 極めて小規模
  eval_freq: 5000         # 1回だけ評価
  save_freq: 10000        # 最後に保存
  log_interval: 1000      # 頻繁にログ出力
  
  # Episode settings
  episode:
    max_steps: 1000  # 短いエピソード
    max_time: 5.0    # 5秒
  
  # Environment settings
  env:
    num_envs: 4      # 少ない並列環境
    render: false
    render_mode: "human"
  
  # Randomization for domain adaptation
  domain_randomization:
    enabled: true
    friction_range: [0.1, 0.8]
    mass_variation: 0.1
    noise_std: 0.01

# Evaluation settings
evaluation:
  num_episodes: 3    # 少ない評価エピソード
  deterministic: true
  render: true
  
  # Success criteria
  success_criteria:
    min_distance: 0.9
    max_time: 10.0
    max_fall_angle: 0.5

# Logging and monitoring
logging:
  tensorboard: true
  wandb: false
  log_dir: "data/logs"
  
  # Metrics to track
  metrics:
    - "episode_reward"
    - "episode_length"
    - "success_rate"
    - "average_speed"
    - "fall_rate"
    - "energy_efficiency"

