# Bittle Robot Configuration - 究極最適化版
robot:
  # Basic robot settings
  name: "bittle"
  type: "quadruped"
  
  # URDF and model settings（最適化）
  model:
    urdf_path: "assets/bittle-urdf/bittle.urdf"
    scale: 0.2                      # 手のひらサイズ
    mass_scale: 1.0
    
  # Physical properties（最適化）
  physics:
    # Materials（最適化）
    friction_coefficient: 0.7       # 適度な摩擦
    restitution: 0.0               # 跳ね返りなし
    contact_damping: 0.03          # 軽減（高速化）
    contact_stiffness: 10000       # 適度な剛性
    
    # Joint properties（最適化）
    joint_damping: 0.03            # 軽減（高速化）
    joint_friction: 0.01           # 軽減（高速化）
    
  # Joint configuration（最適化）
  joints:
    # Joint names
    joint_names:
      - "left-front-shoulder-joint"
      - "left-front-knee-joint"
      - "right-front-shoulder-joint"
      - "right-front-knee-joint"
      - "left-back-shoulder-joint"
      - "left-back-knee-joint"
      - "right-back-shoulder-joint"
      - "right-back-knee-joint"
    
    # Joint limits（安全範囲）
    joint_limits:
      "left-front-shoulder-joint": [-1.2, 1.2]       # 制限（安全性）
      "left-front-knee-joint": [-1.2, 1.2]
      "right-front-shoulder-joint": [-1.2, 1.2]
      "right-front-knee-joint": [-1.2, 1.2]
      "left-back-shoulder-joint": [-1.2, 1.2]
      "left-back-knee-joint": [-1.2, 1.2]
      "right-back-shoulder-joint": [-1.2, 1.2]
      "right-back-knee-joint": [-1.2, 1.2]
    
    # 最適化された初期姿勢設定
    initial_pose:
      diversity_mode: "low"         # 低多様性（安定性重視）
      
      # 段階適応学習（簡略化）
      stage_adaptation:
        enabled: false              # 無効化（シンプル化）
        current_stage: 0
      
      # 基本角度設定（最適化）
      base_angles:
        shoulder: 1.1               # 自然な角度（63度）
        knee: 0.2                   # 軽く曲げた状態（11度）
      
      # 多様性設定（最小限）
      diversity:
        low:
          variation: 0.05           # 最小多様性
  
  # Control settings（最適化）
  control:
    # PD controller parameters（最適化）
    pd_controller:
      # Shoulder joints（肩関節）
      shoulder:
        kp: 60.0                    # 比例ゲイン調整
        kd: 3.0                     # 微分ゲイン調整
        max_torque: 10.0            # 最大トルク調整
      
      # Knee joints（膝関節）
      knee:
        kp: 40.0                    # 比例ゲイン調整
        kd: 2.0                     # 微分ゲイン調整
        max_torque: 6.0             # 最大トルク調整
    
    # Action smoothing（強化）
    action_smoothing:
      enabled: true
      factor: 0.3                   # 強い平滑化
      
    # Safety limits（最適化）
    safety:
      max_joint_velocity: 8.0       # 最大関節速度調整
      max_joint_acceleration: 40.0  # 最大関節加速度調整
      torque_limit_factor: 0.8      # トルク制限強化

# Performance settings（最適化）
performance:
  # Physics optimization（高速化）
  physics_optimization:
    solver_iterations: 25           # 反復回数軽減
    contact_points_threshold: 3     # 接触点閾値軽減
    collision_margin: 0.001         # 衝突マージン
    
  # Memory optimization（メモリ最適化）
  memory_optimization:
    buffer_size_limit: 5000         # バッファサイズ制限
    history_length: 50              # 履歴長制限
    
  # Logging optimization（ログ最適化）
  logging:
    detailed_logs: false            # 詳細ログ無効
    debug_visualization: false      # デバッグ可視化無効
