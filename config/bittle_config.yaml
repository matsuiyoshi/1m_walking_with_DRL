# Bittle Robot Configuration
robot:
  name: "Bittle"
  urdf_path: "assets/bittle-urdf/bittle.urdf"
  
  # Physical specifications
  mass: 0.2  # kg
  dimensions:
    length: 0.20  # m
    width: 0.10   # m
    height: 0.08  # m
  
  # Joint specifications
  joints:
    num_joints: 8
    joint_names:
      - "left-front-shoulder-joint"   # Front Left hip
      - "left-front-knee-joint"       # Front Left knee
      - "right-front-shoulder-joint"  # Front Right hip
      - "right-front-knee-joint"      # Front Right knee
      - "left-back-shoulder-joint"    # Back Left hip
      - "left-back-knee-joint"        # Back Left knee
      - "right-back-shoulder-joint"   # Back Right hip
      - "right-back-knee-joint"       # Back Right knee
    
    # Joint limits (radians)
    joint_limits:
      left-front-shoulder-joint: [-1.57, 1.57]
      left-front-knee-joint: [-1.57, 1.57]
      right-front-shoulder-joint: [-1.57, 1.57]
      right-front-knee-joint: [-1.57, 1.57]
      left-back-shoulder-joint: [-1.57, 1.57]
      left-back-knee-joint: [-1.57, 1.57]
      right-back-shoulder-joint: [-1.57, 1.57]
      right-back-knee-joint: [-1.57, 1.57]
    
    # Joint control parameters
    control:
      frequency: 50  # Hz
      max_torque: 1.0  # Nm
      damping: 0.1

# Environment specifications
environment:
  corridor:
    width: 0.15  # m (15cm)
    length: 1.0  # m
    wall_height: 0.05  # m
  
  # Surface materials
  surfaces:
    cardboard:
      friction: 0.8
      restitution: 0.1
    smooth_desk:
      friction: 0.1
      restitution: 0.05

# Physics simulation
physics:
  timestep: 1/240  # 240 Hz
  gravity: [0, 0, -9.81]  # m/s²
  solver_iterations: 100
  contact_erp: 0.2
  contact_cfm: 0.0001
