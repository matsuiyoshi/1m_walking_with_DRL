# Training Configuration for PPO - 15時間学習用
algorithm:
  name: "PPO"
  
  # Network architecture
  network:
    actor:
      hidden_layers: [256, 256, 128]
      activation: "ReLU"
      output_activation: "Tanh"
    
    critic:
      hidden_layers: [256, 256, 128]
      activation: "ReLU"
  
  # Hyperparameters (15時間学習最適化)
  hyperparameters:
    learning_rate: 0.0003  # より保守的な学習率
    batch_size: 512
    n_epochs: 8            # 過学習防止のため減少
    clip_range: 0.2
    vf_coef: 0.5
    ent_coef: 0.02         # 探索を促進
    max_grad_norm: 0.5
    gae_lambda: 0.95
    gamma: 0.99
    buffer_size: 1536

# Training settings (15時間学習用)
training:
  total_timesteps: 27000000  # 15時間学習用（500ステップ/秒 × 54000秒）
  eval_freq: 1800000        # 1時間ごとに評価（15時間の1/15）
  save_freq: 1800000        # 1時間ごとに保存
  log_interval: 1000        # 適度なログ頻度
  
  # Episode settings
  episode:
    max_steps: 1000
    max_time: 10.0
  
  # Environment settings
  env:
    num_envs: 12
    render: false
    render_mode: "human"
  
  # Randomization for domain adaptation
  domain_randomization:
    enabled: true
    friction_range: [0.1, 0.8]
    mass_variation: 0.1
    noise_std: 0.01

# Early Stopping設定（15時間学習用 - 過学習抑制強化）
early_stopping:
  enabled: true                    # Early Stoppingを有効にする
  patience: 3600000                # 2時間分のpatience（3600kステップ ≈ 2時間）
  min_delta: 0.005                 # より厳格な改善基準
  monitor_metric: "avg_reward"     # 監視する指標
  restore_best_weights: true       # 最良の重みを復元するかどうか
  
  # 追加の過学習検出機能
  overfitting_detection:
    enabled: true
    policy_loss_threshold: 200.0   # Policy Lossが200を超えたら警告
    value_loss_threshold: 2.0      # Value Lossが2.0を超えたら警告
    reward_std_threshold: 0.5      # 報酬の標準偏差が0.5を超えたら警告

# Evaluation settings
evaluation:
  num_episodes: 10                 # より多くのエピソードで評価
  deterministic: true
  render: false
  
  # Success criteria
  success_criteria:
    min_distance: 0.9
    max_time: 10.0
    max_fall_angle: 0.5

# Logging and monitoring
logging:
  tensorboard: true
  wandb: false
  log_dir: "data/logs"
  
  # Metrics to track
  metrics:
    - "episode_reward"
    - "episode_length"
    - "success_rate"
    - "average_speed"
    - "fall_rate"
    - "energy_efficiency"
    - "policy_loss"
    - "value_loss"
    - "entropy"
