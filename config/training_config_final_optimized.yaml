# Training Configuration for PPO - 最終最適化版
algorithm:
  name: "PPO"
  
  # Network architecture（軽量化＋効率化）
  network:
    actor:
      hidden_layers: [256, 128, 64]    # より軽量なネットワーク
      activation: "ReLU"
      output_activation: "Tanh"
    
    critic:
      hidden_layers: [256, 128, 64]    # より軽量なネットワーク
      activation: "ReLU"
  
  # Hyperparameters（最終最適化）
  hyperparameters:
    learning_rate: 0.0003           # 安定した学習率
    batch_size: 256                 # 軽量化（メモリ節約）
    n_epochs: 4                     # 過学習防止（軽量化）
    clip_range: 0.2
    vf_coef: 0.5
    ent_coef: 0.01                  # 探索と活用のバランス
    max_grad_norm: 0.5
    gae_lambda: 0.95
    gamma: 0.99
    buffer_size: 1536               # num_envs * 128

# Training settings（最適化版）
training:
  total_timesteps: 200000           # 10-15分程度のテスト
  eval_freq: 20000                  # 2万ステップごとに評価
  save_freq: 20000                  # 2万ステップごとに保存
  log_interval: 25                  # 頻繁なログ
  
  # Episode settings（緩和）
  episode:
    max_steps: 500                  # ステップ数軽減（計算負荷軽減）
    max_time: 15.0                  # 時間設定
  
  # Environment settings
  env:
    num_envs: 8                     # 環境数軽減（安定性重視）
    render: false
    render_mode: "human"
  
  # Domain randomization（軽減）
  domain_randomization:
    enabled: true
    friction_range: [0.6, 0.8]       # 狭い範囲
    mass_variation: 0.02             # 小さな変動
    noise_std: 0.0005               # 最小ノイズ

# Early Stopping設定（敏感）
early_stopping:
  enabled: true
  patience: 10000                   # 短いpatience（迅速な判定）
  min_delta: 0.02                   # 小さな改善でも検出
  monitor_metric: "avg_reward"
  restore_best_weights: true
  
  # 過学習検出（厳密）
  overfitting_detection:
    enabled: true
    policy_loss_threshold: 50.0     # 低い閾値（早期検出）
    value_loss_threshold: 1.0       # 低い閾値
    reward_std_threshold: 0.3       # 低い閾値

# Evaluation settings
evaluation:
  num_episodes: 3                   # 軽量化
  deterministic: true
  render: false
  
  # Success criteria（現実的）
  success_criteria:
    min_distance: 0.5               # 50cm以上で成功
    max_time: 15.0
    max_fall_angle: 1.0             # より厳密

# Logging and monitoring（軽量化）
logging:
  tensorboard: true
  wandb: false
  log_dir: "data/logs"
  
  # Metrics to track（重要指標のみ）
  metrics:
    - "episode_reward"
    - "episode_length"
    - "success_rate"
    - "policy_loss"
    - "value_loss"
