# Training Configuration for PPO - ネットワーク最適化版
algorithm:
  name: "PPO"
  
  # 最適化されたネットワーク構造
  network:
    use_optimized: true           # 最適化ネットワークを使用
    
    actor:
      hidden_layers: [256, 256, 128]
      activation: "Swish"         # Swish活性化関数（最適化）
      output_activation: "Tanh"
      dropout_rate: 0.1           # ドロップアウト正則化
      use_residual: true          # 残差接続
      use_attention: false        # アテンション機構（軽量化のためfalse）
      use_layer_norm: true        # レイヤー正規化
    
    critic:
      hidden_layers: [256, 256, 128]
      activation: "Swish"         # Swish活性化関数
      dropout_rate: 0.1           # ドロップアウト正則化
      use_residual: true          # 残差接続
      use_layer_norm: true        # レイヤー正規化
  
  # Hyperparameters（ネットワーク最適化に適応）
  hyperparameters:
    learning_rate: 0.0003       # 安定した学習率
    batch_size: 256             # 軽量化
    n_epochs: 4                 # 過学習防止
    clip_range: 0.2
    vf_coef: 0.5
    ent_coef: 0.01              # エントロピー係数
    max_grad_norm: 0.5
    gae_lambda: 0.95
    gamma: 0.99
    buffer_size: 1536

# Training settings（ネットワーク最適化テスト用）
training:
  total_timesteps: 100000       # 短期テスト（5-10分）
  eval_freq: 10000              # 1万ステップごとに評価
  save_freq: 10000              # 1万ステップごとに保存
  log_interval: 25              # 頻繁なログ
  
  # Episode settings
  episode:
    max_steps: 500              # ステップ数軽減
    max_time: 15.0
  
  # Environment settings
  env:
    num_envs: 8                 # 環境数軽減（安定性重視）
    render: false
    render_mode: "human"
  
  # Domain randomization（軽減）
  domain_randomization:
    enabled: true
    friction_range: [0.6, 0.8]
    mass_variation: 0.02
    noise_std: 0.0005

# Early Stopping設定（敏感）
early_stopping:
  enabled: true
  patience: 5000                # 短いpatience（迅速判定）
  min_delta: 0.02               # 小さな改善でも検出
  monitor_metric: "avg_reward"
  restore_best_weights: true
  
  # 過学習検出（厳密）
  overfitting_detection:
    enabled: true
    policy_loss_threshold: 30.0 # より低い閾値
    value_loss_threshold: 1.0
    reward_std_threshold: 0.3

# Evaluation settings
evaluation:
  num_episodes: 3
  deterministic: true
  render: false
  
  # Success criteria
  success_criteria:
    min_distance: 0.5
    max_time: 15.0
    max_fall_angle: 1.0

# Logging and monitoring（重要指標のみ）
logging:
  tensorboard: true
  wandb: false
  log_dir: "data/logs"
  
  # Metrics to track
  metrics:
    - "episode_reward"
    - "episode_length"
    - "success_rate"
    - "policy_loss"
    - "value_loss"
    - "gradient_norm"
