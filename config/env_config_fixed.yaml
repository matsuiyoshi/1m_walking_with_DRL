# Environment Configuration - 緊急修正版
environment:
  name: "BittleWalkingEnv"
  
  # Corridor environment
  corridor:
    width: 0.3       # m (30cm) - より広い通路
    length: 1.0      # m  
    wall_height: 0.05 # m
  
  # Observation space (30 dimensions total)
  observation:
    joint_angles: 8      # Current joint angles
    joint_velocities: 8  # Joint angular velocities
    imu_data: 6         # 3D acceleration + 3D angular velocity
    position_orientation: 6  # 3D position + 3D orientation
    target_position: 2   # Target X, Y coordinates
    total_dimensions: 30
  
  # Action space (8 dimensions)
  action:
    joint_targets: 8     # Target joint angles
    action_range: [-1.0, 1.0]  # Normalized action range
    control_frequency: 50  # Hz
  
  # Reward function weights - 緊急修正版
  reward:
    # 前進報酬を大幅に増加（最重要）
    forward_reward: 200.0           # 5.0 → 200.0 (40倍増加)
    goal_distance_reward: 100.0     # 20.0 → 100.0 (5倍増加)
    goal_progress_reward: 80.0      # 15.0 → 80.0 (5.3倍増加)
    direction_reward: 50.0          # 3.0 → 50.0 (16.7倍増加)
    
    # 安定性報酬を増加
    stability_reward: 30.0          # 1.0 → 30.0 (30倍増加)
    corridor_reward: 50.0           # 10.0 → 50.0 (5倍増加)
    
    # ペナルティを大幅に軽減
    fall_penalty: -50.0             # -1000.0 → -50.0 (20分の1に軽減)
    corridor_penalty: -20.0         # -50.0 → -20.0 (2.5分の1に軽減)
    joint_limit_penalty: -5.0       # -10.0 → -5.0 (2分の1に軽減)
    torque_change_penalty: -0.5     # -1.0 → -0.5 (2分の1に軽減)
    
    # 成功ボーナスを増加
    success_bonus: 500.0            # 200.0 → 500.0 (2.5倍増加)
    time_bonus: 100.0               # 20.0 → 100.0 (5倍増加)
    
    # その他の報酬
    speed_reward: 10.0              # 2.0 → 10.0 (5倍増加)
    energy_penalty: -0.05           # -0.1 → -0.05 (2分の1に軽減)
    
    # ゴール距離報酬のパラメータ
    goal_distance_params:
      max_distance: 1.0             # 最大距離（1m）
      min_distance: 0.1             # 最小距離（10cm）
      distance_decay: 0.5           # 距離減衰係数

# Simulation settings
simulation:
  physics_engine: "pybullet"
  timestep: 0.00416666667  # 1/240 Hz (240 Hz)
  gravity: [0, 0, -9.81]
  
  # Contact and collision
  contact_erp: 0.2
  contact_cfm: 0.0001
  lateral_friction: 0.8  # Default friction
  spinning_friction: 0.1
  rolling_friction: 0.1
  restitution: 0.1
  
  # Solver settings
  num_solver_iterations: 100
  num_substeps: 1

# Environment variations
variations:
  # Surface types
  surfaces:
    cardboard:
      friction: 0.8
      restitution: 0.1
      name: "cardboard"
    
    smooth_desk:
      friction: 0.1
      restitution: 0.05
      name: "smooth_desk"
  
  # Domain randomization
  randomization:
    friction_std: 0.1
    mass_std: 0.02  # 2% of body mass
    sensor_noise_std: 0.01
    action_noise_std: 0.01

# Training settings (for environment)
training:
  episode:
    max_steps: 1000  # ~4 seconds at 240Hz
    max_time: 4.0    # seconds

# Visualization and debugging
visualization:
  gui: false
  debug_lines: false
  show_joint_frames: false
  show_center_of_mass: false
  
  # Camera settings
  camera:
    distance: 2.0
    yaw: 0.0
    pitch: -30.0
    target_position: [0, 0, 0.1]
