algorithm:
  hyperparameters:
    batch_size: 512
    buffer_size: 1536
    clip_range: 0.2
    ent_coef: 0.01
    gae_lambda: 0.95
    gamma: 0.99
    learning_rate: 0.0004
    max_grad_norm: 0.5
    n_epochs: 10
    vf_coef: 0.5
  name: PPO
  network:
    actor:
      activation: ReLU
      hidden_layers:
      - 256
      - 256
      - 128
      output_activation: Tanh
    critic:
      activation: ReLU
      hidden_layers:
      - 256
      - 256
      - 128
early_stopping:
  enabled: true
  min_delta: 0.01
  monitor_metric: avg_reward
  patience: 20000
  restore_best_weights: true
evaluation:
  deterministic: true
  num_episodes: 3
  render: false
  success_criteria:
    max_fall_angle: 0.5
    max_time: 10.0
    min_distance: 0.9
logging:
  log_dir: data/logs
  metrics:
  - episode_reward
  - episode_length
  - success_rate
  - average_speed
  - fall_rate
  - energy_efficiency
  tensorboard: true
  wandb: false
training:
  domain_randomization:
    enabled: true
    friction_range:
    - 0.1
    - 0.8
    mass_variation: 0.1
    noise_std: 0.01
  env:
    num_envs: 12
    render: false
    render_mode: human
  episode:
    max_steps: 1000
    max_time: 10.0
  eval_freq: 50000
  log_interval: 25
  save_freq: 50000
  total_timesteps: 1000000
