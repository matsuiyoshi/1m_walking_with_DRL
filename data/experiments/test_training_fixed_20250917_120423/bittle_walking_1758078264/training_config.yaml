algorithm:
  hyperparameters:
    batch_size: 128
    buffer_size: 1024
    clip_range: 0.2
    ent_coef: 0.01
    gae_lambda: 0.95
    gamma: 0.99
    learning_rate: 0.0003
    max_grad_norm: 0.5
    n_epochs: 5
    vf_coef: 0.5
  name: PPO
  network:
    actor:
      activation: ReLU
      hidden_layers:
      - 256
      - 256
      - 128
      output_activation: Tanh
    critic:
      activation: ReLU
      hidden_layers:
      - 256
      - 256
      - 128
evaluation:
  deterministic: true
  num_episodes: 3
  render: true
  success_criteria:
    max_fall_angle: 0.5
    max_time: 10.0
    min_distance: 0.9
logging:
  log_dir: data/logs
  metrics:
  - episode_reward
  - episode_length
  - success_rate
  - average_speed
  - fall_rate
  - energy_efficiency
  tensorboard: true
  wandb: false
training:
  domain_randomization:
    enabled: true
    friction_range:
    - 0.1
    - 0.8
    mass_variation: 0.1
    noise_std: 0.01
  env:
    num_envs: 4
    render: false
    render_mode: human
  episode:
    max_steps: 1000
    max_time: 5.0
  eval_freq: 5000
  log_interval: 1000
  save_freq: 10000
  total_timesteps: 10000
